[test]
# Single-process runner — all tests share state
# Clean up after yourself: process.env, console, mocks
root = "./tests"

# Bun discovers *.test.ts recursively from root.
# Per-test timeout is set via the npm test script and CI (--timeout=120000) —
# bunfig's `timeout` key is silently ignored by `bun test`, and a preloaded
# setDefaultTimeout() reaches only the first file (bun 1.3.13). Bare
# `bun test` runs at 5s, so a test that spawns many CLI subprocesses
# carries its own timeout (`}, 60_000);`).
