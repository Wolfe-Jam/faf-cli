name: Windows Nightly

# The full test suite on Windows, while nobody is waiting on it: 08:00 UTC
# (about 4am in Atlanta), and on demand. It never gates a PR. A failing test
# here is a real Windows problem to look at in the morning; a stall (a Bun
# process that never exits) shows as a warning and retries once.
on:
  schedule:
    - cron: '0 8 * * *'
  workflow_dispatch:

permissions:
  contents: read

env:
  BUN_VERSION: '1.3.13'

jobs:
  windows:
    name: Windows nightly (Node ${{ matrix.node }})
    runs-on: windows-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node: [22.x, 24.x]
    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v7

      # The runner's default TEMP is an 8.3 short path; RUNNER_TEMP is not.
      - name: Use a temp folder without a short-name alias
        run: |
          echo "TEMP=$RUNNER_TEMP" >> "$GITHUB_ENV"
          echo "TMP=$RUNNER_TEMP" >> "$GITHUB_ENV"

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Setup Node.js ${{ matrix.node }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Full test suite
        timeout-minutes: 12
        run: |
          for attempt in 1 2; do
            set +e
            timeout 300 bun test --timeout=120000
            code=$?
            set -e
            if [ "$code" -ne 124 ]; then exit "$code"; fi
            echo "::warning::Windows nightly test run hung (attempt $attempt of 2), not a test failure"
          done
          exit 124
