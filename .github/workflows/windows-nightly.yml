name: Windows Nightly

# The full test suite on Windows, while nobody is waiting on it: about 4am in
# Atlanta, and on demand. It runs the tests the PR job leaves to it (the ones
# that start the CLI as a child), and a release waits for it to be green on the
# release commit. A child process that hasn't exited in 2 minutes has hung (the
# slowest healthy one takes about 6 s), so it fails there, named, and the rest
# of the suite still runs (#167). Each run saves a per-test timing report.
on:
  schedule:
    # 08:17 UTC. GitHub delays runs set on the hour; ours started 5–9 h late.
    - cron: '17 8 * * *'
  workflow_dispatch:

permissions:
  contents: read

env:
  BUN_VERSION: '1.3.13'

jobs:
  windows:
    name: Windows nightly (Node ${{ matrix.node }})
    runs-on: windows-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        node: [22.x, 24.x]
    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v7

      # The runner's default TEMP is an 8.3 short path; RUNNER_TEMP is not.
      - name: Use a temp folder without a short-name alias
        run: |
          echo "TEMP=$RUNNER_TEMP" >> "$GITHUB_ENV"
          echo "TMP=$RUNNER_TEMP" >> "$GITHUB_ENV"

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Setup Node.js ${{ matrix.node }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Full test suite
        timeout-minutes: 45
        env:
          FAF_TEST_SPAWN_LIMIT_MS: '120000'
        run: bun test --timeout=600000 --reporter=junit --reporter-outfile=junit.xml

      - name: Test timings
        if: always()
        run: |
          [ -f junit.xml ] || { echo "No timing report: the run did not finish." >> "$GITHUB_STEP_SUMMARY"; exit 0; }
          node scripts/test-timings.mjs junit.xml "Windows Node ${{ matrix.node }}" >> "$GITHUB_STEP_SUMMARY"

      - name: Save the timing report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: windows-timings-node-${{ matrix.node }}
          path: junit.xml
          if-no-files-found: ignore
          retention-days: 30
