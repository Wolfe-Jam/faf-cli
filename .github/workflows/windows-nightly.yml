name: Windows Nightly

# The tests the Windows PR job leaves to it (the ones that start the CLI as a
# child, marked with `windowsPr`), while nobody is waiting on it: about 4am in
# Atlanta, and on demand. Everything else already runs on Windows in every PR's
# `windows` job, so the nightly doesn't repeat it: each extra file was another
# chance for bun to finish its tests and never exit (#167, 10-16). Node 22
# decides: a release waits for it to be green on the release commit. Node 24
# runs as a watch: it reports a hung file but can't fail the run. A child
# process that hasn't exited in 2 minutes has hung (the slowest healthy one
# takes about 6 s), so it fails there, named. Each test file runs on its own
# under a 5-minute limit; a file that runs out of time is killed, named, and the
# next file runs, even if the kill never confirms (#167). Each run saves a
# per-test timing report.
on:
  schedule:
    # 08:17 UTC. GitHub delays runs set on the hour; ours started 5–9 h late.
    - cron: '17 8 * * *'
  workflow_dispatch:

permissions:
  contents: read

env:
  BUN_VERSION: '1.3.13'

jobs:
  windows:
    name: Windows nightly (Node ${{ matrix.node }})
    runs-on: windows-latest
    timeout-minutes: 40
    # Node 24 is a watch, not a gate (#167): its job shows red, the run stays green.
    continue-on-error: ${{ matrix.node == '24.x' }}
    strategy:
      fail-fast: false
      matrix:
        node: [22.x, 24.x]
    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v7

      # The runner's default TEMP is an 8.3 short path; RUNNER_TEMP is not.
      - name: Use a temp folder without a short-name alias
        run: |
          echo "TEMP=$RUNNER_TEMP" >> "$GITHUB_ENV"
          echo "TMP=$RUNNER_TEMP" >> "$GITHUB_ENV"

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Setup Node.js ${{ matrix.node }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Nightly-only tests
        timeout-minutes: 30
        env:
          FAF_TEST_SPAWN_LIMIT_MS: '120000'
          FAF_TEST_FILE_LIMIT_MS: '300000'
        run: node scripts/test-per-file.mjs --nightly-only

      - name: Test timings
        if: always()
        run: |
          [ -f junit.xml ] || { echo "No timing report: the run did not finish." >> "$GITHUB_STEP_SUMMARY"; exit 0; }
          node scripts/test-timings.mjs junit.xml "Windows Node ${{ matrix.node }}" >> "$GITHUB_STEP_SUMMARY"

      - name: Save the timing report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: windows-timings-node-${{ matrix.node }}
          path: junit.xml
          if-no-files-found: ignore
          retention-days: 30
